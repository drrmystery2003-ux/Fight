<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>میدان نبرد</title>
<style>
:root{--bg:#eef1f7;--fg:#1b2233;--card:#fff;--mut:#6b7488;--me:#2f7de1;--en:#e5484d;--c1:#8fcf7a;--c2:#7fc16a;--ok:#2e9d57;--sk1:#bfe3ff;--sk2:#eaf6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141824;--fg:#e8ecf5;--card:#202638;--mut:#97a0b8;--c1:#4f8a45;--c2:#467d3d;--sk1:#1b2540;--sk2:#2a3658}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;padding:8px 12px;max-width:500px;margin:0 auto;text-align:center}
h1{font-size:14px;margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:6px 12px;font-size:14px;margin-bottom:4px}
.sc b{font-size:18px}
#board{position:relative;width:100%;max-width:480px;aspect-ratio:5/6.9;box-shadow:0 6px 24px rgba(20,30,60,.25);margin:4px auto;border-radius:14px;overflow:hidden;background:linear-gradient(var(--sk1),var(--sk2));touch-action:none}
#units{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;font-weight:900;font-size:22px;color:#fff;-webkit-text-stroke:4px #3a1010;paint-order:stroke fill;animation:up .9s forwards;transform:translateX(-50%);z-index:5}
.pop.h{color:#7dff9f;-webkit-text-stroke-color:#0f3a1c}
.pop.b{color:#cfe3ff;-webkit-text-stroke-color:#1b2a44}
.pop.x{color:#ff5050;font-size:30px}
.pop.n{color:#ffb347;-webkit-text-stroke-color:#5a2200;font-size:18px}
@keyframes sayIn{0%{opacity:0}100%{opacity:1}}
.pop.say{font-size:14px;-webkit-text-stroke:0;color:#3a1020;background:#fff;border:2px solid #ff7aa8;border-radius:14px;padding:5px 11px;white-space:pre;text-align:center;line-height:1.55;box-shadow:0 3px 10px rgba(0,0,0,.28);animation:sayIn .25s ease-out forwards;transform:translate(-50%,-100%);z-index:6}
@keyframes up{0%{transform:translate(-50%,0) scale(.3)}20%{transform:translate(-50%,-12px) scale(1.35)}40%{transform:translate(-50%,-18px) scale(1)}100%{transform:translate(-50%,-44px) scale(.9);opacity:0}}
#tray{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;margin:4px 0}
.t{background:var(--card);border:2px solid transparent;border-radius:10px;padding:2px 1px;flex:1 1 0;min-width:0;max-width:92px;font:inherit;color:inherit;font-size:10px;line-height:1.25}
.t.sel{border-color:var(--me)}
.t svg{width:30px;height:30px;display:block;margin:0 auto}
.t small{color:var(--mut);font-size:9px}
.t img{width:38px;height:38px;display:block;margin:0 auto;image-rendering:auto}
.cb{background:var(--card);color:inherit;border:0;border-radius:10px;padding:8px 11px;font:inherit;font-size:14px}.cb.on{background:var(--ok);color:#fff}
button.go{background:var(--ok);color:#fff;border:0;border-radius:12px;padding:8px 24px;font:inherit;font-size:16px;margin:2px}
button.go:disabled{opacity:.45}
#tm{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;font-weight:900;font-size:22px;color:#fff;background:rgba(20,24,40,.6);padding:2px 16px;border-radius:14px;pointer-events:none;min-width:84px}#tm:empty{display:none}#tm.w{background:#e5484d;animation:pl .5s infinite alternate}@keyframes pl{to{transform:translateX(-50%) scale(1.14)}}.cb.on{outline:2px solid var(--ok)}
#msg{min-height:18px;font-size:13px;color:var(--mut);margin:2px 0}
#ready{position:absolute;inset:0;width:100%;height:30px;margin:0;padding:0 12px;font-size:15px;font-weight:700;border-radius:10px}
#top{position:relative;min-height:30px;margin:2px 0}
#banner{font-size:16px;font-weight:700;min-height:30px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#menu{margin-top:40px}
#pick{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));text-align:center}
#pick h2{font-size:17px;margin:6px 0 2px}
#pick .pt{font-size:26px;font-weight:900;margin:2px 0}#pick .pt.w{color:var(--en)}
#pick .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:480px;margin:8px auto}
#pick .c{background:var(--card);border:3px solid transparent;border-radius:12px;padding:4px 2px;font:inherit;color:inherit;font-size:11px;line-height:1.5}
#pick .c.on{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
#pick .c img,#pick .c svg{width:76px;height:76px;display:block;margin:0 auto}
#pick .c{position:relative}.gu{position:absolute;top:3px;right:3px;background:var(--ok);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:12px;font-style:normal}
.t{position:relative}.lvb{position:absolute;top:0;left:2px;font-size:9px;background:#e0a800;color:#fff;border-radius:6px;padding:0 3px;z-index:2}
#pick .c small{color:var(--mut);font-size:10px;display:block;line-height:1.3}
#menu button{display:block;width:100%;margin:12px 0}

#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,14,28,.62);color:#fff;font-size:19px;z-index:8;padding:16px}
#al{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#e5242b;color:#fff;padding:5px 14px;border-radius:14px;font-weight:700;font-size:14px;display:none;animation:pl2 .5s infinite alternate;z-index:7;white-space:nowrap;pointer-events:none}
@keyframes pl2{to{transform:translateX(-50%) scale(1.1)}}
#cam{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:4px;z-index:7}
#cam button{border:0;border-radius:9px;background:rgba(32,38,56,.65);color:#fff;font-size:15px;padding:4px 7px}
#bl{display:block;margin:4px auto 2px;height:34px}#bl.full{filter:drop-shadow(0 0 7px #ff2a33)}
.dr{display:inline-block;width:8px;height:11px;margin-left:2px;background:#e5242b;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;vertical-align:-1px}
.t.no{opacity:.45}.fly{position:fixed;left:0;top:0;z-index:99;pointer-events:none}
.bar b{margin:0 3px}.bar svg{vertical-align:-4px}
.lvb:empty{display:none}.up{position:relative;height:11px;margin:2px 3px 1px;background:#0004;border-radius:6px;overflow:hidden;direction:ltr}.uf{height:100%;width:0;background:linear-gradient(#ffd84a,#e0a800);transition:width .2s}.ut{position:absolute;inset:0;font-size:8px;line-height:11px;text-align:center;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;font-weight:700}.t.sp{border-color:#ff8a3a55}
.nx{flex:0 0 42px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.8;font-size:9px;color:var(--mut);line-height:1.2}
.nx svg,.nx img{width:30px;height:30px;display:block;margin:0 auto}
.t{touch-action:none;-webkit-user-select:none;user-select:none}
.pop.vp{color:#ffd9dc;-webkit-text-stroke-color:#5a0008;font-size:26px;animation-duration:1.6s}
.t{touch-action:none}
#info{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));text-align:center}
#itl{direction:ltr;display:flex;align-items:center;gap:6px;max-width:480px;margin:6px auto 2px;flex-wrap:wrap;justify-content:center}#itl input{flex:1;min-width:120px;height:30px;accent-color:#7dff9f;direction:ltr;touch-action:pan-y}#itl .itbt{background:var(--mut);color:#fff;border:0;border-radius:9px;padding:6px 8px;font-weight:800;font-size:12px}#itl span{font-size:12px;font-weight:800;min-width:84px;text-align:center}
#itx2{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#itx2.on{background:var(--ok)}
#info .ihd{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:480px;margin:0 auto 6px}
#info .ihd .go{margin:0;padding:8px 12px;font-size:14px;flex:1}
#itm{font-size:26px;font-weight:900;min-width:44px;color:var(--fg)}#itm.w{color:var(--en)}
#itabs,#itabs2{display:flex;gap:4px;overflow-x:auto;max-width:480px;margin:0 auto 6px;padding:9px 0 2px}
#itabs button,#itabs2 button{flex:0 0 auto;background:var(--card);border:2px solid transparent;border-radius:10px;padding:2px;font:inherit;color:inherit;font-size:10px;width:56px}
#itabs button.on,#itabs2 button.on{border-color:var(--ok)}#itabs img,#itabs svg,#itabs2 img,#itabs2 svg{width:42px;height:42px;display:block;margin:0 auto}
#dv{max-width:480px;margin:0 auto}
#dv #board{aspect-ratio:5/4.1;margin:0 auto}
#ilv{display:flex;gap:6px;justify-content:center;margin:6px 0}
#ilv button{background:var(--card);border:2px solid transparent;border-radius:10px;padding:6px 12px;font:inherit;color:inherit;font-size:13px}#ilv button.on{border-color:var(--ok);background:var(--ok);color:#fff}
#itx{max-width:480px;margin:0 auto;text-align:right;background:var(--card);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.85}
#itx h3{margin:0 0 2px;font-size:17px}#itx .st{color:var(--mut);font-size:12px;margin-bottom:6px}
#itx .lv{padding:3px 6px;border-radius:8px;margin:2px 0}#itx .lv.on{background:rgba(46,157,87,.18)}
.dmsum{position:absolute;left:50%;top:13%;transform:translateX(-50%);z-index:7;font-weight:900;font-size:22px;color:#fff;-webkit-text-stroke:4px #3a1010;paint-order:stroke fill;white-space:nowrap;pointer-events:none}
.dmcap{position:absolute;left:50%;top:2%;transform:translateX(-50%);z-index:7;max-width:92%;text-align:center;font-weight:800;font-size:13px;line-height:1.5;color:#fff;background:rgba(0,0,0,.6);padding:3px 10px;border-radius:9px;pointer-events:none}#dv{position:relative}#dv #bl{display:block;margin:0 auto 50px}.dmar{position:absolute;z-index:8;transform:translateX(-50%);text-align:center;font-weight:900;font-size:14px;color:#7dff9f;-webkit-text-stroke:3px #0f3a1c;paint-order:stroke fill;white-space:nowrap;pointer-events:none;animation:dmfade 3.2s forwards}.dmar svg{display:block;width:22px;height:26px;margin:0 auto}@keyframes dmfade{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}.ydl{position:absolute;transform:translate(-50%,-100%);z-index:6;font-weight:800;font-size:12px;line-height:1.5;color:#fff;background:rgba(0,0,0,.62);padding:2px 7px;border-radius:8px;white-space:nowrap;text-align:center;pointer-events:none}.ydl.ok{color:#7dff9f}.ydl.no{color:#ffb4b4}.dmsum{direction:ltr;unicode-bidi:isolate}.dmring{position:absolute;z-index:8;pointer-events:none;border:3px solid #ff3b3b;border-radius:50% 46% 52% 48%/48% 52% 46% 50%;box-shadow:0 0 0 1px rgba(0,0,0,.45);animation:dmfade 3.8s forwards}.dmtxt{position:absolute;transform:translateX(-50%);z-index:8;font-weight:900;font-size:14px;color:#fff;-webkit-text-stroke:3px #3a1010;paint-order:stroke fill;white-space:nowrap;pointer-events:none;animation:dmfade 3.8s forwards}.dmprog{position:absolute;transform:translate(-50%,-100%);z-index:6;font-weight:900;font-size:14px;color:#fff;background:rgba(0,0,0,.6);padding:1px 8px;border-radius:8px;direction:ltr;pointer-events:none}.eyeic{position:absolute;transform:translate(-50%,-100%);z-index:7;font-size:11px;line-height:1;background:rgba(255,255,255,.93);border:1.5px solid #e5242b;border-radius:8px;padding:0 3px;pointer-events:none;opacity:1;transition:opacity .35s;animation:eyep .6s infinite alternate}@keyframes eyep{to{transform:translate(-50%,-100%) scale(1.12)}}.dmar.tk{white-space:normal;width:150px;line-height:1.35;font-size:12px}.dmar.r{color:#ffb4b4;-webkit-text-stroke-color:#3a1010}.dmsum.full{color:#7dff9f;-webkit-text-stroke-color:#0f3a1c;font-size:26px}
.dmhl{position:absolute;z-index:8;pointer-events:none;border:3px solid #ffd84a;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 12px #ffd84a;transform:translate(-50%,-50%);animation:dmhl .6s infinite alternate}
.dmhl.r{border-color:#ff5050;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 12px #ff5050}
@keyframes dmhl{to{transform:translate(-50%,-50%) scale(1.1)}}
#game{display:flex;flex-direction:column}
#game .bar{order:0}
#game #board{order:3;aspect-ratio:auto;height:var(--bh,calc(min(100vw - 24px,480px)*1.38))}
#game #bl{order:4}#game #tray{order:5}
#game.top #bl{order:1}#game.top #tray{order:2}
#tray .t{font-size:calc(10px*var(--us,1));max-width:calc(92px*var(--us,1))}
#tray .t svg{width:calc(30px*var(--us,1));height:calc(30px*var(--us,1))}
#tray .t img{width:calc(38px*var(--us,1));height:calc(38px*var(--us,1))}
#tray .t small{font-size:calc(9px*var(--us,1))}
#tray .dr{width:calc(8px*var(--us,1));height:calc(11px*var(--us,1))}
#tray .lvb{font-size:calc(9px*var(--us,1))}
#tray .up{height:calc(11px*var(--us,1))}
#tray .ut{font-size:calc(8px*var(--us,1));line-height:calc(11px*var(--us,1))}
#tray .nx{flex:0 0 calc(42px*var(--us,1));font-size:calc(9px*var(--us,1))}
#tray .nx svg,#tray .nx img{width:calc(30px*var(--us,1));height:calc(30px*var(--us,1))}
#gear{background:var(--bg);color:inherit;border:0;border-radius:50%;width:32px;height:32px;font-size:17px;line-height:1;padding:0}
#set{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(460px,calc(100% - 20px));z-index:58;background:var(--card);color:var(--fg);border-radius:16px;padding:8px 14px 12px;box-shadow:0 8px 30px rgba(0,0,0,.45);text-align:right;font-size:14px}
#set .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#set .sh button{background:var(--bg);color:inherit;border:0;border-radius:50%;width:30px;height:30px;font-size:15px}
#set .sr{margin:8px 0}#set .sl{display:flex;justify-content:space-between;margin-bottom:2px}
#set input[type=range]{width:100%;accent-color:var(--ok);height:28px;margin:0}
#set .tg{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw{direction:ltr;position:relative;flex:0 0 auto;width:48px;height:27px;border-radius:14px;border:0;background:var(--mut);padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--ok)}.sw.on::after{left:24px}
#itabs button,#itabs2 button,#tray .t,#pick .c{position:relative}
.crn{position:absolute;top:-8px;left:50%;transform:translateX(-50%);pointer-events:none;line-height:0;z-index:2}.crn svg{width:20px!important;height:18px!important;margin:0!important}
.ci{display:block;font-size:30px;line-height:42px}.ci svg{width:34px!important;height:30px!important;margin:6px auto!important}
#skc{position:absolute;left:8px;bottom:8px;z-index:7;display:flex;gap:8px;align-items:flex-end}.sk{display:none;flex-direction:column;align-items:center;gap:2px}.sk button{position:relative}.sn{position:absolute;right:-2px;top:-2px;min-width:20px;height:20px;border-radius:10px;background:#2f8bff;color:#fff;font:700 12px/20px sans-serif;font-style:normal;text-align:center;border:2px solid #fff}

.sk .dd{display:flex;gap:1px}.sk .dd svg{width:15px;height:19px}

.sk button{width:58px;height:58px;border-radius:50%;border:0;padding:0;background:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

.sk button svg{width:58px;height:58px}

.sk.off button{filter:grayscale(1) brightness(.6)}.sk.off .dd{opacity:.4}

.sk.rdy button{animation:skp .6s infinite alternate}@keyframes skp{to{transform:scale(1.1)}}
</style>
</head>
<body>
<div id="boot" style="position:fixed;inset:0;z-index:99;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:17px"><div style="font-size:40px">⚔️</div><b>میدان نبرد</b><div id="bootm" style="font-size:14px;color:var(--mut)">در حال آماده‌سازی آموزش…</div><style>@keyframes bsp{to{transform:rotate(360deg)}}</style><div style="width:30px;height:30px;border:4px solid var(--mut);border-top-color:var(--ok);border-radius:50%;animation:bsp .8s linear infinite"></div></div>
<div id="menu" style="display:none"><h1>⚔️ میدان نبرد</h1><button class="go" id="bAI">🤖 تک‌نفره با هوش مصنوعی</button><button class="go" id="bOn" style="background:var(--me)">👥 آنلاین با دوست</button>
<div id="onl" style="display:none;background:var(--card);border-radius:14px;padding:14px;margin-top:6px"><button class="go" id="bMk" style="margin:4px 0">🆕 ساخت اتاق و دریافت کد</button><div style="margin:12px 0 6px;font-size:14px;color:var(--mut)">یا کد ۶ حرفی دوستت را وارد کن:</div><input id="code" maxlength="6" dir="ltr" autocomplete="off" autocapitalize="characters" placeholder="ABCDEF" style="width:100%;font-size:26px;letter-spacing:8px;text-align:center;padding:10px;border-radius:12px;border:2px solid var(--mut);background:var(--bg);color:var(--fg);font-family:monospace"><button class="go" id="bJn" style="background:var(--me);margin:10px 0 0">ورود به اتاق</button><div id="omsg" style="min-height:22px;font-size:14px;color:var(--mut);margin-top:8px"></div></div></div>
<div id="game" style="display:none">
<div class="bar"><span>تو <span id="cl1"></span><b id="c1">0</b></span><span style="display:flex;align-items:center;gap:6px"><span id="who" style="font-size:12px;color:var(--mut)"></span><button id="gear" aria-label="settings">⚙️</button></span><span><b id="c2">0</b><span id="cl2"></span> حریف</span></div>
<div id="board"><div id="units"></div><div id="tm"></div><div id="cam"><button id="snd">🔊</button><button id="lk">🔓</button><button id="fl">🔄</button><button id="rst">↺</button></div><div id="al">🩸 قطره‌ها پر شد! نیرو بگذار</div><div id="skc"></div><div id="ov"></div></div>
<canvas id="bl"></canvas><div id="tray"></div></div>
<div id="pick" style="display:none"></div>
<div id="info" style="display:none"><div class="ihd"><button class="go" id="iok">✅ متوجه شدم، برو منو</button><button class="go" id="ipz" style="background:var(--mut)">توقف ویدیو</button></div><div id="itabs"></div><div id="itabs2" style="display:none"></div><div id="dv"></div><div id="itl"><button id="itb" class="itbt">⏪ ۵ث</button><input type="range" id="itr" min="0" max="4000" value="0"><button id="itf" class="itbt">۵ث ⏩</button><span id="itt">۰:۰۰ / ۰:۰۰</span><button id="itx2" class="itbt">⏩ ×۲ (نگه دار)</button></div><div id="ilv"></div><div id="itx"></div></div>
<div id="set" style="display:none"><div class="sh"><b>⚙️ تنظیمات</b><button id="setx">✕</button></div>
<div class="sr"><div class="sl"><span>🔊 صدای بازی</span><b id="v1"></b></div><input type="range" id="r1" min="0" max="100" step="1"></div>
<div class="sr"><div class="sl"><span>🔄 حساسیت چرخش صفحهٔ نبرد</span><b id="v2"></b></div><input type="range" id="r2" min="20" max="200" step="5"></div>
<div class="sr tg"><span>⬆️ انتقال نوار خون و کارت‌ها به بالا</span><button id="t3" class="sw" aria-label="toggle"></button></div>
<div class="sr"><div class="sl"><span>📐 اندازهٔ نوار خون و کارت‌ها</span><b id="v4"></b></div><input type="range" id="r4" min="60" max="130" step="5"></div>
</div>
<svg width="0" height="0" style="position:absolute" id="defs"></svg>
<script>setTimeout(function(){var m=document.getElementById("bootm");if(m)m.textContent="بارگذاری طول کشید؛ اتصال اینترنت را بررسی کن و صفحه را دوباره باز کن."},15000)</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js" onerror="var q=document.createElement('script');q.src='https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js';document.head.appendChild(q)"></script>
<script>
const $=id=>document.getElementById(id);

// ---------- sound (synthesized) ----------
let AC=null,MG=null,NB=null,SND=true;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();const cp=AC.createDynamicsCompressor();MG=AC.createGain();MG.gain.value=ST.vol/100;MG.connect(cp);cp.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AC.resume()}catch(e){AC=null}}
addEventListener('pointerdown',initAudio);addEventListener('keydown',initAudio);
var DMO_FF=false,DMO_SKIP=false;const aok=()=>!DMO_FF&&AC&&SND&&AC.state==='running';
function N(o){const t=AC.currentTime+(o.at||0),s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);f.Q.value=o.q||1;
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(o.v,t+(o.a||.008));g.gain.exponentialRampToValueAtTime(.0001,t+o.d);s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random());s.stop(t+o.d+.05)}
function O(o){const t=AC.currentTime+(o.at||0),s=AC.createOscillator();s.type=o.type||'sine';s.frequency.setValueAtTime(o.f,t);if(o.f2)s.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(o.v,t+(o.a||.005));g.gain.exponentialRampToValueAtTime(.0001,t+o.d);s.connect(g);g.connect(MG);s.start(t);s.stop(t+o.d+.05)}
function VOX(o){const t=AC.currentTime,s=AC.createOscillator();s.type='sawtooth';s.frequency.setValueAtTime(o.f,t);s.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(o.v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+o.d);
  [o.a,o.b].forEach((fq,i)=>{const b=AC.createBiquadFilter();b.type='bandpass';b.frequency.setValueAtTime(fq,t);b.frequency.linearRampToValueAtTime(fq*(o.sh||.8),t+o.d);b.Q.value=6;const gg=AC.createGain();gg.gain.value=i?.5:1;s.connect(b);b.connect(gg);gg.connect(g)});
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=o.f*.05;l.connect(lg);lg.connect(s.frequency);l.start(t);l.stop(t+o.d)}
  g.connect(MG);s.start(t);s.stop(t+o.d+.05)}
const sfx={
  gun(b){if(!aok())return;N({type:'lowpass',f:b?3000:2200,f2:300,q:1,d:b?.28:.14,a:.001,v:b?.4:.28});O({type:'square',f:b?110:190,f2:40,d:.12,a:.001,v:.18})},

  charge(d){if(!aok())return null;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=.8;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(1800,t+d);
    const g=AC.createGain();g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.08,t+.3);g.gain.linearRampToValueAtTime(.3,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random());
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(50,t);o.frequency.exponentialRampToValueAtTime(130,t+d);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;
    const og=AC.createGain();og.gain.setValueAtTime(.001,t);og.gain.linearRampToValueAtTime(.12,t+d);o.connect(lp);lp.connect(og);og.connect(MG);o.start(t);
    let st=false;const kill=(rel)=>{if(st)return;st=true;const n=AC.currentTime;try{[g,og].forEach(x=>{x.gain.cancelScheduledValues(n);x.gain.setValueAtTime(Math.max(.0001,x.gain.value),n);x.gain.linearRampToValueAtTime(.0001,n+rel)});s.stop(n+rel+.03);o.stop(n+rel+.03)}catch(e){}};

    else if(k==='K'){O({f:110,f2:60,d:.2,v:.4});[420,860,1330].forEach((f,i)=>O({f,d:.35-i*.07,v:.1,a:.002}));N({type:'highpass',f:3200,d:.05,v:.3,a:.001})}
    else if(k==='W'){[523,659,784,1047,1319].forEach((f,i)=>O({f,d:.4,v:.07,a:.01,at:i*.055}));N({type:'highpass',f:5500,d:.35,v:.07,a:.05})}
    else if(k==='H'){[1047,1319,1568].forEach((f,i)=>O({f,d:.7,v:.08,a:.01,at:i*.09}));O({type:'triangle',f:523,f2:659,d:.5,v:.05})}

    else if(k==='G'){VOX({f:88,f2:52,d:.75,a:380,b:700,v:.4,sh:.7,vib:5});O({f:55,f2:32,d:.35,v:.4,at:.2});N({type:'lowpass',f:500,f2:120,d:.4,v:.3,a:.01,at:.2})}
    else if(k==='N'){N({type:'highpass',f:4200,d:.05,v:.2,a:.002});O({type:'triangle',f:1300,f2:520,d:.12,v:.08})}
    else if(k==='F'){N({f:600,f2:2200,q:1,d:.18,a:.03,v:.2});O({type:'triangle',f:500,f2:900,d:.15,v:.08})}else if(k==='Z'){O({f:90,f2:40,d:.35,v:.5});N({type:'lowpass',f:700,f2:120,d:.4,v:.4,a:.004});N({type:'highpass',f:2800,d:.06,v:.25,a:.002,at:.05})}else if(k==='V'){O({f:120,f2:60,d:.25,v:.35});N({type:'highpass',f:3000,d:.06,v:.25,a:.002});[880,1320].forEach((f,i)=>O({f,d:.3,v:.05,at:i*.08}))}},
  roar(){if(!aok())return;
    VOX({f:110,f2:52,d:1.25,a:520,b:950,v:.45,sh:.65,vib:11});
    O({type:'sawtooth',f:72,f2:36,d:1.15,a:.12,v:.12});
    N({f:380,f2:150,q:1.6,d:1.2,a:.15,v:.38});
    N({type:'highpass',f:1800,f2:4500,d:.9,a:.2,v:.2,at:.3});
    N({type:'lowpass',f:600,f2:120,d:1,a:.05,v:.3,at:.25})},
  dflap(){if(!aok())return;
    N({f:150,f2:460,q:.8,d:.38,a:.09,v:.42});
    O({f:75,f2:42,d:.32,a:.03,v:.28});
    N({type:'lowpass',f:520,f2:180,d:.32,a:.1,v:.22,at:.05})},
  rockThud(){if(!aok())return;O({f:95,f2:38,d:.28,v:.45});N({type:'lowpass',f:800,f2:150,d:.22,v:.38,a:.003})},

let YDR=new Map();
function ydClear(){for(const q of YDR.values()){sc.remove(q.g);q.g.traverse(m=>{if(m.geometry)m.geometry.dispose();if(m.material)m.material.dispose()});q.el.remove()}YDR.clear()}
function ydMake(){const g=new T.Group(),P=[],C=[[.5,.5,0],[-.5,.5,90],[-.5,-.5,180],[.5,-.5,270]];
  for(const[cx,cz,a0]of C)for(let i=0;i<=16;i++){const a=(a0+i*90/16)*Math.PI/180;P.push(new T.Vector2(cx+YDET*Math.cos(a),cz+YDET*Math.sin(a)))}
  const sh=new T.Shape(P),f=new T.Mesh(new T.ShapeGeometry(sh),new T.MeshBasicMaterial({color:0xff3b3b,transparent:true,opacity:.16,side:T.DoubleSide,depthWrite:false}));f.rotation.x=Math.PI/2;g.add(f);
  const ln=new T.LineLoop(new T.BufferGeometry().setFromPoints(P.map(p=>new T.Vector3(p.x,0,p.y))),new T.LineBasicMaterial({color:0xff5050,depthTest:false,transparent:true}));g.add(ln);sc.add(g);return g}
function ydUpdate(){
  if(!(DMO_ON&&DMO_K==='Y')){if(YDR.size)ydClear();return}
  const seen=new Set(),vs=LL.filter(v=>v.k==='V'&&v.s==='p2'&&v.hp>0);
  for(const u of LL){if(u.k!=='Y'||u.s!=='p1'||u.hp<=0)continue;const o=UN.get(u.id);if(!o)continue;seen.add(u.id);

    r.onpointerup=r.onpointercancel=()=>{if(DMO_SD){want=null;demoSeek(r.value/4000*demoLen());DMO_SD=false;demoTlUpd()}};
    $('itb').onclick=()=>demoSeek(Math.max(0,DMO_T-12));$('itf').onclick=()=>demoSeek(DMO_T+12)}
  {const b=$('itx2'),on=()=>{DMO_SPD=2;b.classList.add('on')},off=()=>{DMO_SPD=1;DMO_ACC=0;b.classList.remove('on')};
    b.onpointerdown=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}on()};b.onpointerup=b.onpointercancel=b.onlostpointercapture=off;b.oncontextmenu=e=>e.preventDefault()}
  $('iok').onclick=end;$('ipz').onclick=()=>{DMO_UP=!DMO_UP;dmoSync()};
}
function pickDeck(){pickDeck2()}

function setUI(){$('r1').value=ST.vol;$('r2').value=ST.sens;$('r4').value=ST.size;$('v1').textContent=faD(ST.vol)+'٪';$('v2').textContent=faD(ST.sens)+'٪';$('v4').textContent=faD(ST.size)+'٪';$('t3').classList.toggle('on',!!ST.top)}
$('gear').onclick=()=>{const p=$('set');if(p.style.display==='none'){setUI();p.style.display='block'}else p.style.display='none'};
$('setx').onclick=()=>{$('set').style.display='none'};
$('r1').oninput=e=>{ST.vol=+e.target.value;saveST();applyST();setUI()};
$('r1').onchange=()=>{initAudio();sfx.place('N')};
$('r2').oninput=e=>{ST.sens=+e.target.value;saveST();setUI()};
$('t3').onclick=()=>{ST.top=ST.top?0:1;saveST();applyST();setUI()};
$('r4').oninput=e=>{ST.size=+e.target.value;saveST();applyST();setUI()};
$('bAI').onclick=()=>{PEND={who:'p1',ai:true};pickDeck()};
$('bOn').onclick=()=>{$('onl').style.display=$('onl').style.display==='block'?'none':'block'};
$('code').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,6)};
$('bMk').onclick=()=>host(0);$('bJn').onclick=()=>join($('code').value);
// شروع: ابتدا آموزش (بدون شمارش زمان)، بعد از دکمهٔ سبز منو نمایش داده می‌شود
showInfo(()=>{$('menu').style.display=''});
